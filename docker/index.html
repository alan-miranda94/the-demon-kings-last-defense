<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Diffusion API</title>
    </head>
    <body>
        <h1>Gerar Spritesheet</h1>

        <button id="btn">Geraaar</button>

        <pre id="status"></pre>

        <img
            id="img"
            style="
                max-width: 512px;
                border: 1px solid #ccc;
                display: block;
                margin-top: 16px;
            "
        />

        <script>
            const apiUrl = "http://localhost:8091";

            document
                .getElementById("btn")
                .addEventListener("click", gerarImagem);

            async function gerarImagem() {
                const status = document.getElementById("status");
                const img = document.getElementById("img");

                status.textContent = "Gerando...";
                img.src = "";

                try {
                    const response = await fetch(`${apiUrl}/generate`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            prompt: "pixel art warrior sprite, white background, clean pixels, dark outline",
                            negative_prompt:
                                "black image, dark, blurry, realistic, 3d, photo, text, watermark",
                            width: 384,
                            height: 384,
                            steps: 30,
                            guidance_scale: 8,
                        }),
                    });

                    const data = await response.json();

                    status.textContent = JSON.stringify(data, null, 2);

                    if (!response.ok) return;

                    img.src = data.url;
                } catch (error) {
                    status.textContent = error.message;
                }
            }
        </script>
    </body>
</html>
